version: 2.1

jobs:
  build-twrp:
    docker:
      - image: ubuntu:20.04
    environment:
      # Set your device codename here
      DEVICE: "CD6"
      # TWRP branch to build
      TWRP_BRANCH: "twrp-12.1"
      # Device tree repo URL
      DEVICE_TREE_REPO: "https://github.com/Mikesew1320/TECNO-CD6-PBRP-Tree.git"
      ANDROID_ROOT: "/home/circleci/android"
    steps:
      - checkout

      # Install required packages
      - run:
          name: Install dependencies
          command: |
            apt-get update
            apt-get install -y git wget unzip openjdk-8-jdk python3 bc curl rsync build-essential ccache

      # Setup build directories
      - run:
          name: Prepare build environment
          command: |
            mkdir -p $ANDROID_ROOT
            cd $ANDROID_ROOT

      # Clone TWRP recovery
      - run:
          name: Clone TWRP
          command: |
            cd $ANDROID_ROOT
            git clone -b $TWRP_BRANCH https://github.com/TeamWin/android_bootable_recovery.git bootable/recovery

      # Clone your device tree
      - run:
          name: Clone Device Tree
          command: |
            cd $ANDROID_ROOT
            git clone $DEVICE_TREE_REPO device/TECNO/$DEVICE

      # Initialize environment
      - run:
          name: Setup environment and lunch
          command: |
            cd $ANDROID_ROOT
            source build/envsetup.sh
            lunch omni_$DEVICE-eng

      # Build recovery image
      - run:
          name: Build TWRP recovery
          command: |
            cd $ANDROID_ROOT
            mka recoveryimage

      # Store recovery image as artifact
      - store_artifacts:
          path: $ANDROID_ROOT/out/target/product/$DEVICE/recovery.img
          destination: recovery.img

workflows:
  version: 2
  build-and-store:
    jobs:
      - build-twrp
